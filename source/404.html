<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>页面不存在 - Nolan's Blog</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
       background:#f5f6f8;color:#333}
  .wrap{max-width:520px;width:100%;background:#fff;border-radius:14px;padding:2.5rem 2rem;
        box-shadow:0 6px 30px rgba(0,0,0,.08);text-align:center}
  .code{font-size:4rem;font-weight:700;letter-spacing:.1em;color:#4a87c1;line-height:1}
  h1{font-size:1.35rem;font-weight:600;margin:1rem 0 .8rem}
  p{font-size:.95rem;line-height:1.75;color:#666}
  .tip{margin-top:.9rem;font-size:.85rem;color:#999}
  .tip code{background:#f2f4f7;border-radius:4px;padding:.15em .4em;font-size:.9em;color:#4a87c1}
  nav{margin-top:1.8rem;display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap}
  .btn{display:inline-block;padding:.6rem 1.4rem;border-radius:999px;border:1px solid #d9dde3;
       color:#444;text-decoration:none;font-size:.92rem;transition:.15s}
  .btn:hover{background:#f2f4f7}
  .btn.primary{background:#4a87c1;border-color:#4a87c1;color:#fff}
  .btn.primary:hover{background:#3d76ac}
</style>
<script>
(function () {
  var segs = location.pathname.split('/').filter(Boolean);
  if (!segs.length) { return; }
  var slug = decodeURIComponent(segs[segs.length - 1]);
  if (!slug || !/^[\w\-.%\u4e00-\u9fa5]+$/.test(slug)) { return; }
  fetch('/api/posts.json', { cache: 'no-cache' })
    .then(function (r) { return r.json(); })
    .then(function (json) {
      var posts = (json && (json.data || json)) || [];
      for (var i = 0; i < posts.length; i++) {
        if (posts[i] && posts[i].slug === slug) {
          location.replace('/#/posts/' + encodeURIComponent(slug));
          return;
        }
      }
    })
    .catch(function () {});
})();
</script>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <h1>页面不存在</h1>
    <p>你访问的地址没有找到，可能是链接拼写有误，或者这篇文章已经被移动、重命名。</p>
    <p class="tip">本站文章地址形如 <code>/#/posts/文章代号</code>，从首页点进文章即可正常访问。</p>
    <nav>
      <a class="btn primary" href="/">返回首页</a>
      <a class="btn" href="/#/archives">查看档案</a>
    </nav>
  </div>
</body>
</html>
